<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cash — simple money tracker</title>
<meta name="description" content="A simple cash book. Track what you have, what comes in and what goes out. Everything stays on your phone.">

<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1b1a" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Cash">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">

<link rel="stylesheet" href="css/app.css">

<script>
  try {
    var t = localStorage.getItem('cash-theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>
<body>

<header class="app-header" id="header"></header>
<main class="app-main" id="app"></main>
<nav class="nav" id="nav" aria-label="Main"></nav>

<noscript>
  <div class="app-main">
    <div class="view">
      <div class="card">
        <h2>JavaScript is needed</h2>
        <p>This app runs entirely on your phone, so it needs JavaScript. Nothing is calculated on a server,
        because nothing is ever sent to one.</p>
      </div>
    </div>
  </div>
</noscript>

<script type="module" src="js/app.js"></script>
</body>
</html>
