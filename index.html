<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Aoiro — Japan freelance tax and accounting</title>
<meta name="description" content="Expense tracking, double-entry bookkeeping, tax calculation and advice for a foreign sole proprietor in Japan. Runs entirely on your device.">

<!-- Installable as an Android app. Paths are relative so it works from a GitHub Pages sub-path. -->
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Aoiro">
<link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="assets/icons/icon-192.png">

<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/components.css">
<link rel="stylesheet" href="css/views.css">

<!-- Avoids a flash of the wrong theme before the module loads. -->
<script>
  try {
    var t = localStorage.getItem('aoiro-theme');
    if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
  } catch (e) {}
</script>
</head>
<body>

<header class="app-header" id="header"></header>

<main class="app-shell" id="app">
  <div class="view">
    <div class="card">
      <p>Loading your books…</p>
    </div>
  </div>
</main>

<nav class="nav" id="nav" aria-label="Main"></nav>

<noscript>
  <div class="app-shell">
    <div class="view">
      <div class="card">
        <h2>JavaScript is required</h2>
        <p>Aoiro does all of its calculation on your device, which means it needs JavaScript. Nothing is computed
        on a server, because nothing is sent to one.</p>
      </div>
    </div>
  </div>
</noscript>

<script type="module" src="js/app.js"></script>
</body>
</html>
